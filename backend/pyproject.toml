[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codebase-assistant"
version = "0.1.0"
description = "Codebase Intelligence Assistant API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<0.29",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8,<2",
    "httpx>=0.28,<0.29",
    "mypy>=1.17,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9.1,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires PostgreSQL with pgvector",
    "smoke: requires local Ollama and RUN_LLM_SMOKE=1",
]
addopts = [
    "-q",
    "-m",
    "not integration and not smoke",
    "--cov=codebase_assistant",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["codebase_assistant"]

[tool.coverage.report]
fail_under = 80
show_missing = true
omit = ["*/migrations/*"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
