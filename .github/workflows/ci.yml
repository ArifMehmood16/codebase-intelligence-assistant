# Workflow file is kept as a CI example. Automatic GitHub-hosted runs are off.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: make setup
      - run: make lint
      - run: make test
